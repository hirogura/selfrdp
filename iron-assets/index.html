<!doctype html>
<html lang="ja">
<head>




<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>selfRDP</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #141821; color: #e7ecf3; }
  #bar { height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: #1b1f27; border-bottom: 1px solid #2b3240; }
  #bar .title { font-weight: 700; font-size: 18px; }
  #bar .ver { color: #8d9bb0; font-size: 12px; }
  #msg { color: #e0a458; font-size: 12px; }
  #wrap { height: calc(100% - 48px); display: flex; align-items: center; justify-content: center; }
  #form { width: 380px; padding: 24px; background: #1b1f27; border: 1px solid #2b3240; border-radius: 10px; }
  #form h2 { margin: 0 0 14px; font-size: 16px; }
  label { display: block; color: #8d9bb0; font-size: 12px; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 6px;
    border: 1px solid #3a4457; background: #12161e; color: #e7ecf3; font: inherit; }
  button { margin-top: 16px; width: 100%; padding: 9px; border: 0; border-radius: 6px;
    background: #0068c3; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; }
  #session { height: calc(100% - 48px); display: none; background: #000; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>
</head>
<body>
  <div id="bar">
    <span class="title">selfRDP</span><span class="ver">v.0.2.0</span>
    <span style="flex:1"></span>
    <span id="msg"></span>
    <button id="btn-update" type="button" style="width:auto;margin:0">アップデート</button>
    <button id="btn-restart" type="button" style="width:auto;margin:0">再起動</button>
  </div>
  <div id="wrap">
    <form id="form">
      <h2>RDP に接続 (IronRDP WASM)</h2>
      <label for="host">ホスト名 / IP</label>
      <input id="host" placeholder="ホスト名 / IP" required>
      <label for="username">ユーザー名</label>
      <input id="username" autocomplete="username" required>
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="connect" type="submit">接続</button>
    </form>
  </div>
  <div id="session"><canvas id="canvas" tabindex="0"></canvas></div>
<script type="module">
import init, { SessionBuilder, DesktopSize, Extension, setup, InputTransaction, DeviceEvent } from './pkg/ironrdp_web.js';

const msg = document.getElementById('msg');
const wrap = document.getElementById('wrap');
const sessionDiv = document.getElementById('session');
const canvas = document.getElementById('canvas');

// DOM key -> RDP scancode (minimal but covers common keys)
const scancodes = {
  KeyA:30,KeyB:48,KeyC:46,KeyD:32,KeyE:18,KeyF:33,KeyG:34,KeyH:35,KeyI:23,KeyJ:36,KeyK:37,KeyL:38,
  KeyM:50,KeyN:49,KeyO:24,KeyP:25,KeyQ:16,KeyR:19,KeyS:31,KeyT:20,KeyU:22,KeyV:47,KeyW:17,KeyX:45,KeyY:21,KeyZ:44,
  Digit0:11,Digit1:2,Digit2:3,Digit3:4,Digit4:5,Digit5:6,Digit6:7,Digit7:8,Digit8:9,Digit9:10,
  Enter:28,Escape:1,Backspace:14,Tab:15,Space:57,ShiftLeft:42,ShiftRight:54,ControlLeft:29,ControlRight:97,
  AltLeft:56,AltRight:100,MetaLeft:91,ArrowUp:72,ArrowDown:80,ArrowLeft:75,ArrowRight:77,
  F1:59,F2:60,F3:61,F4:62,F5:63,F6:64,F7:65,F8:66,F9:67,F10:68,F11:87,F12:88,
  Minus:12,Equal:13,BracketLeft:26,BracketRight:27,Backslash:43,Semicolon:39,Quote:40,
  Comma:51,Period:52,Slash:53,Backquote:41,CapsLock:58,Delete:83,Home:71,End:79,PageUp:73,PageDown:81
};

function sendTransaction(events) {
  if (!currentSession) return;
  const t = new InputTransaction();
  for (const e of events) t.addEvent(e);
  currentSession.applyInputs(t);
}

let currentSession = null;

function bindInput(session) {
  currentSession = session;
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    // canvas の内部解像度と CSS 表示サイズの比率を反映する
    const scaleX = (canvas.width || r.width) / r.width;
    const scaleY = (canvas.height || r.height) / r.height;
    const x = (e.clientX - r.left) * scaleX;
    const y = (e.clientY - r.top) * scaleY;
    sendTransaction([DeviceEvent.mouseMove(x, y)]);
  });
  canvas.addEventListener('mousedown', e => sendTransaction([DeviceEvent.mouseButtonPressed(e.button)]));
  canvas.addEventListener('mouseup', e => sendTransaction([DeviceEvent.mouseButtonReleased(e.button)]));
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    sendTransaction([DeviceEvent.wheelRotations(true, e.deltaY > 0 ? -1 : 1, 0)]);
  }, { passive: false });
  canvas.addEventListener('keydown', e => {
    const sc = scancodes[e.code];
    if (sc !== undefined) { e.preventDefault(); sendTransaction([DeviceEvent.keyPressed(sc)]); }
  });
  canvas.addEventListener('keyup', e => {
    const sc = scancodes[e.code];
    if (sc !== undefined) { e.preventDefault(); sendTransaction([DeviceEvent.keyReleased(sc)]); }
  });
}

async function connect(host, username, password) {
  msg.textContent = '初期化中…';
  await init();
  setup('info');
  msg.textContent = 'トークン取得中…';
  const tr = await fetch('/api/rdp-token?host=' + encodeURIComponent(host));
  const tj = await tr.json();
  if (!tj.ok) throw new Error(tj.message || 'トークン取得に失敗');

  msg.textContent = '接続中…';
  const builder = new SessionBuilder()
    .destination(host)
    .proxyAddress(`wss://${location.host}/jet/rdp`)
    .authToken(tj.token)
    .username(username)
    .password(password)
    .desktopSize(new DesktopSize(1280, 800))
    .renderCanvas(canvas)
    .setCursorStyleCallbackContext(canvas)
    .setCursorStyleCallback(() => {})
    .extension(new Extension('enable_credssp', false));

  const session = await builder.connect();
  wrap.style.display = 'none';
  sessionDiv.style.display = 'block';
  msg.textContent = '';
  canvas.focus();
  bindInput(session);
  const info = await session.run();
  msg.textContent = 'セッション終了: ' + info.reason();
  currentSession = null;
}

async function controlApi(action) {
  const r = await fetch('/api/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
  return r.json();
}
document.getElementById('btn-update').addEventListener('click', async () => {
  if (!confirm('GitHub から selfRDP をアップデートして再起動しますか？')) return;
  const j = await controlApi('update');
  msg.textContent = j.message || '';
});
document.getElementById('btn-restart').addEventListener('click', async () => {
  if (!confirm('selfRDP サービスを再起動しますか？')) return;
  const j = await controlApi('restart');
  msg.textContent = j.message || '';
  setTimeout(() => location.reload(), 4000);
});

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('connect');
  btn.disabled = true;
  try {
    await connect(document.getElementById('host').value.trim(),
      document.getElementById('username').value.trim(),
      document.getElementById('password').value);
  } catch (err) {
    msg.textContent = 'Connection failed: ' + (err && err.backtrace ? err.backtrace() : err);
    console.error(err);
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
