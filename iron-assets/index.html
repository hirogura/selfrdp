<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>selfRDP</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #141821; color: #e7ecf3; }
  #bar { height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: #1b1f27; border-bottom: 1px solid #2b3240; }
  #bar .title { font-size: 18px; font-weight: 700; }
  #bar .ver { font-size: 12px; color: #8d9bb0; margin-right: auto; }
  button { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid #3a4457; background: #262d3b; color: #e7ecf3; }
  button:hover { background: #313a4c; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #0068c3; border-color: #007ad9; }
  button.danger { background: #7a2630; border-color: #a33b48; }
  #msg { font-size: 12px; color: #e0a458; }
  #info { font-size: 11px; color: #8d9bb0; margin-right: 8px; }
  #keys { display: none; align-items: center; gap: 5px; flex-wrap: wrap; }
  #app { display: flex; height: calc(100% - 48px); }
  #sidebar { width: 230px; flex-shrink: 0; overflow-y: auto; padding: 10px;
    background: #171b24; border-right: 1px solid #2b3240; }
  #sidebar h3 { margin: 2px 0 10px; font-size: 12px; color: #8d9bb0; font-weight: 600; }
  .card { position: relative; background: #202634; border: 1px solid #333c4d; border-radius: 8px;
    padding: 10px 26px 10px 10px; margin-bottom: 8px; cursor: pointer; }
  .card:hover { border-color: #6cb6ff; background: #263040; }
  .card.active { border-color: #2ecc71; background: #1d3229; }
  .card .name { font-size: 13px; font-weight: 600; }
  .card .host { font-size: 11px; color: #8d9bb0; margin-top: 3px; word-break: break-all; }
  .card .badge { font-size: 9px; color: #2ecc71; margin-top: 2px; }
  .card .del { position: absolute; top: 5px; right: 5px; padding: 1px 5px; font-size: 11px;
    background: transparent; border-color: transparent; color: #8d9bb0; }
  .card .del:hover { color: #ff7b84; border-color: #7a2630; }
  #main { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  #wrap { height: 100%; display: flex; align-items: center; justify-content: center; overflow: auto; }
  #form { width: 400px; max-width: calc(100% - 24px); padding: 18px; box-sizing: border-box;
    background: #1b1f27; border: 1px solid #2b3240; border-radius: 10px; }
  #form h2 { margin: 0 0 10px; font-size: 16px; }
  label { display: block; color: #8d9bb0; font-size: 11px; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px;
    border: 1px solid #3a4457; background: #12161e; color: #e7ecf3; font: inherit; font-size: 13px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .checks { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; }
  .checks label { color: #c9d2e0; display: flex; align-items: center; gap: 5px; margin: 0; }
  .checks input { width: auto; }
  #actions { display: flex; gap: 8px; margin-top: 12px; }
  #actions button { flex: 1; }
  #hint { font-size: 10px; color: #77849a; margin-top: 9px; }
  #session { position: absolute; inset: 0; width: auto; height: auto; display: none; background: #000;
    align-items: center; justify-content: center; overflow: hidden; }
  /* 箱は領域いっぱい、中身は object-fit で比率維持して全体表示 */
  canvas { display: block; outline: none; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <div id="bar">
    <span class="title">selfRDP</span><span class="ver">v.0.7.0</span>
    <span id="keys">
      <button type="button" data-key="halfwidth">半角/全角</button>
      <button type="button" data-key="henkan">変換</button>
      <button type="button" data-key="muhenkan">無変換</button>
      <button type="button" data-key="ctrlaltdel">Ctrl+Alt+Del</button>
      <button type="button" data-key="win">Win</button>
      <button type="button" data-key="altTab">Alt+Tab</button>
      <button type="button" data-key="taskmgr">Ctrl+Shift+Esc</button>
      <button type="button" data-key="printscreen">PrtSc</button>
      <select id="viewmode" title="表示サイズ" style="width:auto;padding:4px">
        <option value="fit">縮小して全体表示</option>
        <option value="fill">ウィンドウに合わせる</option>
        <option value="native">原寸大</option>
      </select>
      <button id="btn-fullscreen" type="button">全画面</button>
    </span>
    <span id="info"></span>
    <span id="msg"></span>
    <button id="btn-update" type="button">アップデート</button>
    <button id="btn-restart" type="button">再起動</button>
    <button id="btn-disconnect" type="button" class="danger" style="display:none">切断</button>
  </div>
  <div id="app">
    <div id="sidebar"><h3>接続先</h3><div id="cards"></div></div>
    <div id="main">
      <div id="wrap">
        <form id="form">
          <h2>接続先の設定</h2>
          <label for="name">プロファイル名</label>
          <input id="name" placeholder="例: 作業用 PC">
          <div class="row">
            <div><label for="host">ホスト名 / IP</label><input id="host" placeholder="PC 名 / IP" required></div>
            <div><label for="username">ユーザー名</label><input id="username" autocomplete="username"></div>
          </div>
          <div class="row">
            <div><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password"></div>
            <div><label for="resolution">解像度</label>
              <select id="resolution" style="width:100%;box-sizing:border-box;padding:7px 9px;border-radius:6px;border:1px solid #3a4457;background:#12161e;color:#e7ecf3;font:inherit;font-size:13px">
                <option value="1024x768">1024 x 768</option>
                <option value="1280x800" selected>1280 x 800</option>
                <option value="1600x900">1600 x 900</option>
                <option value="1920x1080">1920 x 1080</option>
                <option value="2560x1440">2560 x 1440 (WQHD)</option>
                <option value="3440x1440">3440 x 1440 (UWQHD)</option>
                <option value="3840x2160">3840 x 2160 (4K)</option>
              </select>
            </div>
          </div>
          <div class="checks">
            <label><input type="checkbox" id="autodetect" checked> 方式を自動判定</label>
            <label><input type="checkbox" id="credssp"> NLA / CredSSP</label>
            <label><input type="checkbox" id="perf" checked> 描画を軽量化</label>
            <label><input type="checkbox" id="savepass"> パスワードを保存</label>
          </div>
          <div id="actions">
            <button id="btn-save" type="button">保存</button>
            <button id="btn-connect" class="primary" type="submit">接続</button>
          </div>
          <div id="hint">設定とパスワードは /opt/selfrdp-data（root のみ）に保存されます。</div>
        </form>
      </div>
      <div id="session"><canvas id="canvas" tabindex="0"></canvas></div>
    </div>
  </div>
<script type="module">
import init, { SessionBuilder, DesktopSize, Extension, setup, InputTransaction, DeviceEvent } from './pkg/ironrdp_web.js';

const $ = id => document.getElementById(id);
const msg = $('msg');
const form = $('form');
const wrap = $('wrap');
const sessionDiv = $('session');
const canvas = $('canvas');
const keys = $('keys');
const disconnectBtn = $('btn-disconnect');

// デバッグ用: ブラウザ側の例外をサーバに記録する
function logError(text) {
  fetch('/api/log', { method:'POST', headers:{'Content-Type':'text/plain'}, body:'browser: ' + String(text).slice(0,1000) }).catch(()=>{});
}
window.addEventListener('error', e => logError(e.message));
window.addEventListener('unhandledrejection', e => logError(e.reason));

const scancodes = {
  KeyA:30,KeyB:48,KeyC:46,KeyD:32,KeyE:18,KeyF:33,KeyG:34,KeyH:35,KeyI:23,KeyJ:36,KeyK:37,KeyL:38,
  KeyM:50,KeyN:49,KeyO:24,KeyP:25,KeyQ:16,KeyR:19,KeyS:31,KeyT:20,KeyU:22,KeyV:47,KeyW:17,KeyX:45,KeyY:21,KeyZ:44,
  Digit0:11,Digit1:2,Digit2:3,Digit3:4,Digit4:5,Digit5:6,Digit6:7,Digit7:8,Digit8:9,Digit9:10,
  Enter:28,Escape:1,Backspace:14,Tab:15,Space:57,ShiftLeft:42,ShiftRight:54,ControlLeft:29,ControlRight:97,
  AltLeft:56,AltRight:100,MetaLeft:91,ArrowUp:72,ArrowDown:80,ArrowLeft:75,ArrowRight:77,
  F1:59,F2:60,F3:61,F4:62,F5:63,F6:64,F7:65,F8:66,F9:67,F10:68,F11:87,F12:88,
  Minus:12,Equal:13,BracketLeft:26,BracketRight:27,Backslash:43,Semicolon:39,Quote:40,
  Comma:51,Period:52,Slash:53,Backquote:41,CapsLock:58,Delete:83,Home:71,End:79,PageUp:73,PageDown:81,
  IntlYen:124,KanaMode:112,Hiragana:113,NonConvert:123,Convert:125,
};
const special = {
  halfwidth:[0x29], henkan:[125], muhenkan:[123], ctrlaltdel:[29,56,83], win:[91],
  altTab:[56,15], taskmgr:[29,42,1], printscreen:[0x37],
};

let currentSession = null;
let profiles = [];
let viewTimer = null;
let activeIndex = -1;

function updateView() {
  if (!currentSession) return;
  const cw = canvas.width || 1280, ch = canvas.height || 800;
  const mode = $('viewmode').value;
  if (mode === 'native') {
    canvas.style.width = (canvas.width || 1280) + 'px';
    canvas.style.height = (canvas.height || 800) + 'px';
    canvas.style.objectFit = 'contain';
    sessionDiv.style.overflow = 'auto';
  } else {
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.objectFit = mode === 'fill' ? 'fill' : 'contain';
    sessionDiv.style.overflow = 'hidden';
  }
  const r = canvas.getBoundingClientRect();
  $('info').textContent = 'RDP ' + cw + 'x' + ch + ' → 表示 ' + Math.round(r.width) + 'x' + Math.round(r.height);
}
window.addEventListener('resize', updateView);
$('viewmode').addEventListener('change', updateView);
$('btn-fullscreen').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (sessionDiv.requestFullscreen) sessionDiv.requestFullscreen();
});
new ResizeObserver(() => updateView()).observe(sessionDiv);

function sendTransaction(events) {
  if (!currentSession) return;
  const t = new InputTransaction();
  for (const e of events) t.addEvent(e);
  currentSession.applyInputs(t);
}

function bindInput(session) {
  currentSession = session;
  updateView();
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    const cw = canvas.width || 1280, ch = canvas.height || 800;
    const mode = $('viewmode').value;
    let scaleX = r.width / cw, scaleY = r.height / ch, ox = 0, oy = 0;
    if (mode !== 'fill') {
      // object-fit: contain のレターボックスを差し引く
      const s = Math.min(r.width / cw, r.height / ch);
      scaleX = scaleY = s;
      ox = (r.width - cw * s) / 2;
      oy = (r.height - ch * s) / 2;
    }
    const x = (e.clientX - r.left - ox) / scaleX;
    const y = (e.clientY - r.top - oy) / scaleY;
    sendTransaction([DeviceEvent.mouseMove(x, y)]);
  });
  canvas.addEventListener('mousedown', e => sendTransaction([DeviceEvent.mouseButtonPressed(e.button)]));
  canvas.addEventListener('mouseup', e => sendTransaction([DeviceEvent.mouseButtonReleased(e.button)]));
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    sendTransaction([DeviceEvent.wheelRotations(true, e.deltaY > 0 ? -1 : 1, 0)]);
  }, { passive: false });
  canvas.addEventListener('keydown', e => {
    const sc = scancodes[e.code];
    if (sc !== undefined) { e.preventDefault(); sendTransaction([DeviceEvent.keyPressed(sc)]); }
  });
  canvas.addEventListener('keyup', e => {
    const sc = scancodes[e.code];
    if (sc !== undefined) { e.preventDefault(); sendTransaction([DeviceEvent.keyReleased(sc)]); }
  });
  keys.querySelectorAll('button[data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      const seq = special[btn.dataset.key] || [];
      sendTransaction(seq.map(sc => DeviceEvent.keyPressed(sc)));
      setTimeout(() => sendTransaction(seq.slice().reverse().map(sc => DeviceEvent.keyReleased(sc))), 90);
      canvas.focus();
    });
  });
}

function showSession(on) {
  wrap.style.display = on ? 'none' : 'flex';
  sessionDiv.style.display = on ? 'flex' : 'none';
  keys.style.display = on ? 'flex' : 'none';
  disconnectBtn.style.display = on ? '' : 'none';
  if (on) {
    updateView();
    setTimeout(updateView, 200);
    setTimeout(updateView, 1000);
    if (viewTimer) clearInterval(viewTimer);
    viewTimer = setInterval(updateView, 500);
  } else if (viewTimer) {
    clearInterval(viewTimer); viewTimer = null;
  }
}

function profileData() {
  const res = $('resolution').value.split('x');
  return {
    name: $('name').value.trim(), host: $('host').value.trim(),
    username: $('username').value.trim(),
    password: $('savepass').checked ? $('password').value : '',
    autodetect: $('autodetect').checked, credssp: $('credssp').checked,
    width: Number(res[0]), height: Number(res[1]),
    perf: $('perf').checked ? 0x87 : 0,
  };
}

function applyProfile(p, index) {
  activeIndex = index;
  $('name').value = p.name || '';
  $('host').value = p.host || '';
  $('username').value = p.username || '';
  $('password').value = p.password || '';
  $('savepass').checked = !!p.password;
  $('autodetect').checked = p.autodetect !== false;
  $('credssp').checked = !!p.credssp;
  $('perf').checked = p.perf !== 0;
  $('resolution').value = (p.width || 1280) + 'x' + (p.height || 800);
  renderCards();
}

function renderCards() {
  const box = $('cards');
  box.innerHTML = '';
  profiles.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === activeIndex ? ' active' : '');
    const name = document.createElement('div'); name.className = 'name'; name.textContent = p.name;
    const host = document.createElement('div'); host.className = 'host'; host.textContent = p.host;
    const badge = document.createElement('div'); badge.className = 'badge';
    badge.textContent = p.password ? 'パスワード保存済み' : (p.credssp ? 'NLA' : 'TLS');
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.title = '削除';
    del.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm('「' + p.name + '」を削除しますか？')) return;
      await fetch('/api/profiles', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'delete', name:p.name }) });
      await loadProfiles();
    });
    card.append(name, host, badge, del);
    card.addEventListener('click', async () => {
      applyProfile(p, i);
      if (p.password) {
        try { await connect({ ...p }); }
        catch (err) { msg.textContent = 'Connection failed: ' + (err && err.backtrace ? err.backtrace() : err); }
      } else {
        msg.textContent = 'パスワードを入力して接続してください';
        $('password').focus();
      }
    });
    box.appendChild(card);
  });
  const add = document.createElement('button');
  add.textContent = '+ 新規'; add.style.width = '100%'; add.style.marginTop = '4px';
  add.addEventListener('click', () => {
    activeIndex = -1;
    form.reset();
    $('autodetect').checked = true; $('perf').checked = true;
    $('resolution').value = '1280x800';
    renderCards();
  });
  box.appendChild(add);
}

async function loadProfiles() {
  const r = await fetch('/api/profiles');
  const j = await r.json();
  profiles = j.profiles || [];
  if (activeIndex >= profiles.length) activeIndex = -1;
  renderCards();
}

$('btn-save').addEventListener('click', async () => {
  const r = await fetch('/api/profiles', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'save', profile:profileData() }) });
  const j = await r.json();
  msg.textContent = j.message || '';
  await loadProfiles();
});

async function connect(p) {
  if (p.autodetect) {
    msg.textContent = '接続方式を判定中…';
    try {
      const pr = await fetch('/api/probe?host=' + encodeURIComponent(p.host));
      const pj = await pr.json();
      if (pj.ok) p.credssp = !!pj.credssp;
    } catch (e) { /* 手動設定を使う */ }
  }
  msg.textContent = '初期化中…';
  await init();
  setup('info');
  msg.textContent = 'トークン取得中…';
  const tr = await fetch('/api/rdp-token?host=' + encodeURIComponent(p.host));
  const tj = await tr.json();
  if (!tj.ok) throw new Error(tj.message || 'トークン取得に失敗');

  msg.textContent = '接続中…';
  const builder = new SessionBuilder()
    .destination(p.host)
    .proxyAddress(`wss://${location.host}/jet/rdp`)
    .authToken(tj.token)
    .username(p.username)
    .password(p.password || $('password').value)
    .desktopSize(new DesktopSize(p.width, p.height))
    .renderCanvas(canvas)
    .setCursorStyleCallbackContext(canvas)
    .setCursorStyleCallback(() => {})
    .extension(new Extension('enable_credssp', p.credssp));
  if (p.perf) builder.extension(new Extension('performance_flags', p.perf));

  const session = await builder.connect();
  showSession(true);
  msg.textContent = '';
  bindInput(session);
  const info = await session.run();
  msg.textContent = 'セッション終了: ' + info.reason();
  currentSession = null;
  showSession(false);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('btn-connect'); btn.disabled = true;
  try { await connect(profileData()); }
  catch (err) { msg.textContent = 'Connection failed: ' + (err && err.backtrace ? err.backtrace() : err); logError(err && err.backtrace ? err.backtrace() : err); }
  finally { btn.disabled = false; }
});

disconnectBtn.addEventListener('click', () => {
  if (!currentSession || !confirm('接続を切断しますか？')) return;
  currentSession.shutdown(); currentSession = null; showSession(false);
  msg.textContent = '切断しました';
});

async function controlApi(action) {
  const r = await fetch('/api/' + action, { method:'POST', headers:{'Content-Type':'application/json'} });
  return r.json();
}
$('btn-update').addEventListener('click', async () => {
  if (!confirm('GitHub から selfRDP をアップデートして再起動しますか？')) return;
  msg.textContent = (await controlApi('update')).message || '';
});
$('btn-restart').addEventListener('click', async () => {
  if (!confirm('selfRDP サービスを再起動しますか？')) return;
  msg.textContent = (await controlApi('restart')).message || '';
  setTimeout(() => location.reload(), 4000);
});

loadProfiles();
</script>
</body>
</html>
