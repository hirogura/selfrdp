# selfRDP リバースプロキシ (http コンテキストに配置されます)
#   /            -> IronRDP (Rust + WASM) クライアント (selfRDP トップページ)
#   /api/*       -> 制御 API (アップデート / 再起動 / トークン発行)
#   /jet/*       -> Devolutions Gateway (RDCleanPath プロキシ / WebSocket)

map $http_upgrade $selfrdp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 7173;
    server_name _;
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:7172;
        proxy_set_header Host $host;
    }

    # IronRDP は RDCleanPath で gateway の /jet/rdp に WebSocket 接続する
    location /jet/ {
        proxy_pass http://127.0.0.1:7171;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $selfrdp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        alias /opt/selfrdp/iron-assets/;
        index index.html;
    }
}
