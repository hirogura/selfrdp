# selfRDP リバースプロキシ (http コンテキストに配置されます)
#   /            -> 制御 API (制御画面)
#   /api/*       -> 制御 API (アップデート / 再起動)
#   /jet/* など  -> Devolutions Gateway (RDP Web クライアント / WebSocket)

map $http_upgrade $selfrdp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 7173;
    server_name _;
    client_max_body_size 64m;

    location = / {
        proxy_pass http://127.0.0.1:7172/;
        proxy_set_header Host $host;
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:7172/index.html;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:7172;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:7171;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $selfrdp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
