<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>selfRDP</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #141821; }
  #selfrdp-bar {
    height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: #1b1f27; border-bottom: 1px solid #2b3240; color: #e7ecf3;
  }
  #selfrdp-bar .title { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
  #selfrdp-bar .ver { font-size: 12px; color: #8d9bb0; }
  #selfrdp-bar .spacer { flex: 1; }
  #selfrdp-bar button {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid #3a4457; background: #262d3b; color: #e7ecf3;
  }
  #selfrdp-bar button:hover { background: #313a4c; }
  #selfrdp-bar button:disabled { opacity: .5; cursor: default; }
  #selfrdp-msg { font-size: 12px; color: #8d9bb0; min-width: 1px; }
  #selfrdp-frame { height: calc(100% - 52px); }
  #selfrdp-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div id="selfrdp-bar">
    <span class="title">selfRDP</span>
    <span class="ver">v.0.1.0</span>
    <span class="spacer"></span>
    <span id="selfrdp-msg"></span>
    <button id="btn-update" type="button">アップデート</button>
    <button id="btn-restart" type="button">再起動</button>
  </div>
  <div id="selfrdp-frame">
    <iframe src="/jet/webapp/client" title="RDP クライアント"></iframe>
  </div>
<script>
(function () {
  var msg = document.getElementById('selfrdp-msg');
  var updateBtn = document.getElementById('btn-update');
  var restartBtn = document.getElementById('btn-restart');

  function setBusy(busy) {
    updateBtn.disabled = busy;
    restartBtn.disabled = busy;
  }
  function show(text) { msg.textContent = text; }

  function call(action) {
    setBusy(true);
    show(action === 'update' ? 'アップデート中…' : '再起動中…');
    return fetch('/api/' + action, { method: 'POST' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        show(res.j.message || (res.ok ? '完了しました' : '失敗しました'));
        if (res.ok && action === 'restart') {
          setTimeout(function () { location.reload(); }, 4000);
        }
      })
      .catch(function () { show('通信に失敗しました'); })
      .finally(function () { setBusy(false); });
  }

  updateBtn.addEventListener('click', function () {
    if (confirm('GitHub から selfRDP をアップデートして再起動しますか？')) call('update');
  });
  restartBtn.addEventListener('click', function () {
    if (confirm('selfRDP サービスを再起動しますか？')) call('restart');
  });
})();
</script>
</body>
</html>
